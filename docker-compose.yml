version: "3.9"

services:
  diagnostic-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: algo-diagnostic
    ports:
      - "8002:8002"
    environment:
      DATABASE_URL: postgresql://algo:algo_password@algo-postgres-diag:5432/algo_diagnostic
      CONTENT_DB_URL: postgresql://algo:algo_password@content-postgres:5432/algo_content
      REDIS_URL: redis://redis:6379
      APP_ENV: ${APP_ENV:-production}
      DEBUG: ${DEBUG:-false}
      STANDALONE: ${STANDALONE:-true}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      AZURE_DEEPSEEK_API_KEY: ${AZURE_DEEPSEEK_API_KEY:-}
      AZURE_DEEPSEEK_ENDPOINT: ${AZURE_DEEPSEEK_ENDPOINT:-}
      AZURE_DEEPSEEK_MODEL: ${AZURE_DEEPSEEK_MODEL:-deepseek-v4-flash}
      REPORT_NARRATIVE_ENABLED: ${REPORT_NARRATIVE_ENABLED:-true}
      CORS_ORIGINS: '["http://localhost:3000","http://127.0.0.1:3000","http://localhost:8000","http://127.0.0.1:8000"]'
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:-http://algo-auth:8000}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-local-internal-service-token-change-in-production}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    networks:
      - algo-network

  postgres:
    image: postgres:15-alpine
    container_name: algo-postgres-diag
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: algo
      POSTGRES_PASSWORD: algo_password
      POSTGRES_DB: algo_diagnostic
    volumes:
      - diag_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U algo -d algo_diagnostic"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - algo-network

  redis:
    image: redis:7-alpine
    container_name: algo-redis-diag
    ports:
      - "6380:6379"
    command: >
      redis-server
      --appendonly yes
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
    volumes:
      - diag_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - algo-network

volumes:
  diag_postgres_data:
  diag_redis_data:

networks:
  algo-network:
    external: true
    name: algo-network
